# SPDX-License-Identifier: BSD-3-Clause
#
# build-kernel.yml
#
# Builds Ubuntu kernel .deb packages from a suite branch
# (e.g. "noble") that was populated by fetch-source-pkg.yml.
#
# Build modes:
#   docker  (default) – runs the build inside the suite-matched
#                       ghcr.io/qualcomm-linux/pkg-builder:<suite> container
#                       via docker-pkg-build; ensures a clean, reproducible
#                       environment that exactly matches the target distro.
#   native            – runs dpkg-buildpackage directly on the runner host.
#
# Output .deb packages are stored in two places:
#   1. S3 bucket       – qli-prd-lecore-gh-artifacts (permanent)
#   2. GitHub artifact – attached to the workflow run, retained 90 days

name: "Build: Canonical Kernel .deb Packages"

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite branch to build from (e.g. noble, questing, resolute)"
        required: true
        default: "noble"
        type: string
      kernel_version:
        description: "Kernel version string (e.g. 6.8.0-51.52) – used for release asset attachment"
        required: false
        type: string
      arch:
        description: "Target Debian architecture"
        required: false
        default: "arm64"
        type: choice
        options:
          - arm64
          - amd64
      flavor:
        description: "Kernel flavour to build"
        required: false
        default: "generic"
        type: choice
        options:
          - generic
          - lowlatency
          - all
      build_mode:
        description: "Build mode: docker (suite-matched container) or native (host)"
        required: false
        default: "docker"
        type: choice
        options:
          - docker
          - native

permissions:
  contents: write   # upload assets to release tag

jobs:
  # --------------------------------------------------------------------------
  # Job: build
  # --------------------------------------------------------------------------
  build:
    name: "Build ${{ inputs.suite }} ${{ inputs.flavor }} (${{ inputs.arch }}) [${{ inputs.build_mode || 'docker' }}]"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    env:
      SUITE:       ${{ inputs.suite       || 'noble' }}
      ARCH:        ${{ inputs.arch        || 'arm64' }}
      FLAVOR:      ${{ inputs.flavor      || 'generic' }}
      BUILD_MODE:  ${{ inputs.build_mode  || 'docker' }}

    steps:
      # -----------------------------------------------------------------------
      # 1. Free up disk space
      #    GitHub-hosted ubuntu-24.04-arm runners ship with ~14 GB free.
      #    The kernel build needs ~20 GB; removing unused toolchains gives
      #    enough headroom.
      # -----------------------------------------------------------------------
      - name: Free up runner disk space
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" \
            2>/dev/null || true
          sudo apt-get clean
          echo "Disk after cleanup:"
          df -h /

      # -----------------------------------------------------------------------
      # 2. Checkout the suite branch (contains the full kernel source tree)
      # -----------------------------------------------------------------------
      - name: Checkout suite branch (${{ inputs.suite || 'noble' }})
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.suite || 'noble' }}
          path: kernel-src

      # -----------------------------------------------------------------------
      # 3. Extract org/repo for S3 upload path
      # -----------------------------------------------------------------------
      - name: Extract org and repo name
        run: |
          echo "ORG_NAME=${GITHUB_REPOSITORY%%/*}" >> "$GITHUB_ENV"
          echo "REPO_NAME=${GITHUB_REPOSITORY#*/}"  >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # 4. Checkout docker-pkg-build (docker mode only)
      # -----------------------------------------------------------------------
      - name: Checkout docker-pkg-build
        if: env.BUILD_MODE == 'docker'
        uses: actions/checkout@v4
        with:
          repository: qualcomm-linux/docker-pkg-build
          ref: main
          path: docker-pkg-build

      # -----------------------------------------------------------------------
      # 5. Build the suite-matched pkg-builder docker image (docker mode only)
      # -----------------------------------------------------------------------
      - name: Build docker image for suite (${{ inputs.suite || 'noble' }})
        if: env.BUILD_MODE == 'docker'
        run: |
          ./docker-pkg-build/docker_deb_build.py --rebuild -d "${SUITE}"
          docker image ls

      # -----------------------------------------------------------------------
      # 6a. Build kernel packages inside the suite-matched container (docker)
      #     The workspace is bind-mounted so output .deb files land on the host.
      # -----------------------------------------------------------------------
      - name: Build kernel packages (docker – ghcr.io/qualcomm-linux/pkg-builder:${{ inputs.suite || 'noble' }})
        if: env.BUILD_MODE == 'docker'
        run: |
          JOBS=$(nproc)
          if [ "${FLAVOR}" = "all" ]; then TARGET="binary"; else TARGET="binary-${FLAVOR}"; fi

          echo "Building: suite=${SUITE}  target=${TARGET}  arch=${ARCH}  jobs=${JOBS}"

          docker run -i --privileged --rm \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            --workdir="${GITHUB_WORKSPACE}" \
            "ghcr.io/qualcomm-linux/pkg-builder:${SUITE}" \
            bash -c "
              set -e
              # Enable deb-src so apt-get build-dep can resolve build dependencies.
              # Ubuntu 24.04 uses DEB822 format (/etc/apt/sources.list.d/ubuntu.sources).
              if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
                sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
              else
                grep '^deb ' /etc/apt/sources.list | sed 's/^deb /deb-src /' >> /etc/apt/sources.list
              fi
              apt-get update -qq
              apt-get build-dep -y kernel-src/
              cd kernel-src/
              # The Ubuntu kernel uses debian.master/ with debian/ as a symlink.
              # Ensure the symlink exists (git may not preserve it).
              if [ ! -e debian ] && [ -d debian.master ]; then
                ln -sf debian.master debian
                echo 'Created debian -> debian.master symlink'
              fi
              export DEB_BUILD_OPTIONS='parallel=${JOBS} nocheck'
              fakeroot debian/rules ${TARGET}
            "

      # -----------------------------------------------------------------------
      # 6b. Build kernel packages natively on the runner (native mode)
      # -----------------------------------------------------------------------
      - name: Install build tools (native mode)
        if: env.BUILD_MODE == 'native'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot devscripts dpkg-dev debhelper dh-exec rsync
          sudo apt-get build-dep -y kernel-src/

      - name: Build kernel packages (native)
        if: env.BUILD_MODE == 'native'
        run: |
          JOBS=$(nproc)
          if [ "${FLAVOR}" = "all" ]; then TARGET="binary"; else TARGET="binary-${FLAVOR}"; fi

          echo "Building: suite=${SUITE}  target=${TARGET}  arch=${ARCH}  jobs=${JOBS}"
          export DEB_BUILD_OPTIONS="parallel=${JOBS} nocheck"

          (
            cd kernel-src/
            # Ensure debian/ symlink exists (Ubuntu kernel uses debian.master/)
            if [ ! -e debian ] && [ -d debian.master ]; then
              ln -sf debian.master debian
              echo "Created debian -> debian.master symlink"
            fi
            fakeroot debian/rules "${TARGET}"
          )

      # -----------------------------------------------------------------------
      # 7. Collect output packages
      #    The Ubuntu kernel build drops .deb files one level above the
      #    source tree (i.e. in GITHUB_WORKSPACE, not inside kernel-src/).
      # -----------------------------------------------------------------------
      - name: Collect built packages
        run: |
          mkdir -p output/

          find "${GITHUB_WORKSPACE}" -maxdepth 1 \
            \( -name "*.deb" -o -name "*.changes" -o -name "*.buildinfo" \) \
            -exec cp {} output/ \;

          echo "Built packages:"
          ls -lh output/ || echo "(no files found)"

      # -----------------------------------------------------------------------
      # 8. Upload to S3 (permanent storage, self-hosted runner only)
      # -----------------------------------------------------------------------
      - name: Upload kernel .deb packages to S3
        continue-on-error: true
        uses: qualcomm-linux/upload-private-artifact-action@aws
        with:
          s3_bucket: qli-prd-lecore-gh-artifacts
          path: ${{ github.workspace }}/output
          destination: ${{ env.ORG_NAME }}/pkg/temp/${{ env.REPO_NAME }}/${{ github.run_id }}-${{ github.run_attempt }}/

      # -----------------------------------------------------------------------
      # 9. Upload as GitHub Actions artifact (90-day fallback)
      # -----------------------------------------------------------------------
      - name: Upload packages as artifact
        uses: actions/upload-artifact@v7
        with:
          name: "kernel-debs-${{ inputs.suite }}-${{ inputs.arch }}-${{ inputs.flavor }}"
          path: output/
          retention-days: 90
          if-no-files-found: warn

      # -----------------------------------------------------------------------
      # 10. Attach packages to the release tag (if kernel_version was provided)
      # -----------------------------------------------------------------------
      - name: Attach packages to release tag
        if: inputs.kernel_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${SUITE}-${{ inputs.kernel_version }}"
          DEBS=$(find output/ -name "*.deb" | sort)

          if [ -z "${DEBS}" ]; then
            echo "No .deb files to attach"
            exit 0
          fi

          if gh release view "${TAG}" \
               --repo "${{ github.repository }}" \
               --json tagName -q .tagName \
               >/dev/null 2>&1; then
            echo "Attaching packages to release ${TAG}..."
            echo "${DEBS}" | xargs gh release upload "${TAG}" \
              --repo "${{ github.repository }}" \
              --clobber
            echo "Packages attached to ${TAG}"
          else
            echo "Release tag '${TAG}' not found – packages available via S3 and artifact"
          fi

      # -----------------------------------------------------------------------
      # 11. Summary
      # -----------------------------------------------------------------------
      - name: Print summary
        if: always()
        run: |
          echo "## Kernel Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Suite        | \`${SUITE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Architecture | \`${ARCH}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Flavour      | \`${FLAVOR}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build mode   | \`${BUILD_MODE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Container    | \`ghcr.io/qualcomm-linux/pkg-builder:${SUITE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runner       | \`${{ runner.name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Built packages" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh output/*.deb 2>/dev/null || echo "(none)"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
