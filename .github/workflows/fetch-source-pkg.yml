# SPDX-License-Identifier: BSD-3-Clause
#
# fetch-source-pkg.yml
#
# Fetches the latest Canonical Ubuntu kernel source package from Launchpad,
# extracts it with dpkg-source, and commits the full source tree to a branch
# named after the Ubuntu suite (e.g. "noble", "questing").
#
# Repository branch layout
# ─────────────────────────
#   main          – CI infrastructure: workflows, scripts, documentation
#   noble         – Ubuntu Noble (24.04 LTS) kernel source, one commit/upload
#   <suite>       – additional suites added on demand (questing, resolute, …)
#
# Each commit on a suite branch is tagged  <suite>-<version>
# (e.g.  noble-6.8.0-51.52).
#
# The workflow is idempotent: if the tag already exists it exits cleanly.
# On success it automatically dispatches build-kernel.yml.
#
# Repository variables (Settings → Variables → Actions):
#   KERNEL_SUITE   – default suite to sync when not specified (default: noble)
#   KERNEL_SOURCE  – source package name (default: linux)

name: "Sync: Canonical Kernel Sources to Branch"

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: "0 4 * * *"

  workflow_dispatch:
    inputs:
      suite:
        description: "Ubuntu suite to sync (e.g. noble, questing, resolute)"
        required: false
        default: "noble"
        type: string
      force:
        description: "Force sync even if this version is already committed"
        type: boolean
        default: false

permissions:
  contents: write   # push to suite branch + create tags
  actions: write    # dispatch build-kernel.yml via gh workflow run

jobs:
  # --------------------------------------------------------------------------
  # Job 1: check-version
  #   Queries Launchpad and decides whether a sync is needed.
  # --------------------------------------------------------------------------
  check-version:
    name: "Check latest version on Launchpad"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    outputs:
      version:          ${{ steps.query.outputs.version }}
      upstream_version: ${{ steps.query.outputs.upstream_version }}
      tag:              ${{ steps.query.outputs.tag }}
      suite:            ${{ steps.query.outputs.suite }}
      source:           ${{ steps.query.outputs.source }}
      should_sync:      ${{ steps.gate.outputs.should_sync }}

    steps:
      - name: Install dependencies
        run: sudo apt-get install -y --no-install-recommends jq

      # -----------------------------------------------------------------------
      # Query Launchpad REST API
      # -----------------------------------------------------------------------
      - name: Query Launchpad for latest published source
        id: query
        env:
          SUITE:  ${{ inputs.suite || vars.KERNEL_SUITE || 'noble' }}
          SOURCE: ${{ vars.KERNEL_SOURCE || 'linux' }}
        run: |
          API="https://api.launchpad.net/1.0/ubuntu/+archive/primary"
          API+="?ws.op=getPublishedSources"
          API+="&source_name=${SOURCE}"
          API+="&distro_series=/ubuntu/${SUITE}"
          API+="&status=Published"
          API+="&order_by_date=true"

          echo "Querying: ${API}"
          RESP=$(curl -fsSL "${API}")

          # Filter by exact source_package_name (source_name= is a prefix match)
          VERSION=$(echo "$RESP" | jq -r \
            --arg name "${SOURCE}" \
            '[.entries[] | select(.source_package_name == $name)] | .[0].source_package_version // empty')
          [ -n "${VERSION}" ] || {
            echo "ERROR: No exact match for '${SOURCE}' in ${SUITE}" >&2
            exit 1
          }

          UPSTREAM=$(echo "${VERSION}" | cut -d'-' -f1)
          TAG="${SUITE}-${VERSION}"

          echo "version=${VERSION}"           >> "$GITHUB_OUTPUT"
          echo "upstream_version=${UPSTREAM}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"                   >> "$GITHUB_OUTPUT"
          echo "suite=${SUITE}"               >> "$GITHUB_OUTPUT"
          echo "source=${SOURCE}"             >> "$GITHUB_OUTPUT"

          echo "Suite   : ${SUITE}"
          echo "Version : ${VERSION}"
          echo "Tag     : ${TAG}"

      # -----------------------------------------------------------------------
      # Gate: skip if the tag already exists (unless force=true)
      # -----------------------------------------------------------------------
      - name: Check whether tag already exists
        id: gate
        env:
          TAG: ${{ steps.query.outputs.tag }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            echo "Force flag set – will re-sync"
            exit 0
          fi

          if git ls-remote --exit-code --tags \
               "https://github.com/${{ github.repository }}.git" \
               "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "Tag '${TAG}' already exists – nothing to do"
          else
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            echo "Tag '${TAG}' not found – will sync"
          fi

  # --------------------------------------------------------------------------
  # Job 2: sync
  #   Downloads the source package, extracts it, and commits to the suite
  #   branch.
  # --------------------------------------------------------------------------
  sync:
    name: "Sync ${{ needs.check-version.outputs.suite }} sources to branch"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    needs: check-version
    if: needs.check-version.outputs.should_sync == 'true'

    env:
      VERSION:          ${{ needs.check-version.outputs.version }}
      UPSTREAM_VERSION: ${{ needs.check-version.outputs.upstream_version }}
      TAG:              ${{ needs.check-version.outputs.tag }}
      SUITE:            ${{ needs.check-version.outputs.suite }}
      SOURCE:           ${{ needs.check-version.outputs.source }}

    steps:
      # -----------------------------------------------------------------------
      # 1. Free up disk space (GitHub-hosted runners have ~14 GB free)
      # -----------------------------------------------------------------------
      - name: Free up runner disk space
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" \
            2>/dev/null || true
          sudo apt-get clean
          echo "Disk after cleanup:"
          df -h /

      # -----------------------------------------------------------------------
      # 2. Checkout main branch to get the helper scripts
      # -----------------------------------------------------------------------
      - name: Checkout main (for scripts)
        uses: actions/checkout@v6
        with:
          ref: main
          path: ci

      # -----------------------------------------------------------------------
      # 3. Install tools
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            curl jq devscripts dpkg-dev quilt rsync patch

      # -----------------------------------------------------------------------
      # 4. Download source package from Launchpad
      # -----------------------------------------------------------------------
      - name: Fetch source package from Launchpad
        run: |
          chmod +x ci/scripts/fetch-source-pkg.sh
          ci/scripts/fetch-source-pkg.sh "${SUITE}" "${SOURCE}" source-pkg/

          echo "Downloaded files:"
          ls -lh source-pkg/

      # -----------------------------------------------------------------------
      # 5. Extract source package
      # -----------------------------------------------------------------------
      - name: Extract source package
        run: |
          DSC=$(find source-pkg/ -name "*.dsc" | sort -V | tail -1)
          echo "Extracting: ${DSC}"
          # --no-check skips GPG signature verification (key not in runner keyring)
          # Redirect verbose "upstream files modified" list to log file
          dpkg-source --no-check -x "${DSC}" kernel-src/ \
            > /tmp/dpkg-source.log 2>&1 || {
            echo "dpkg-source -x failed. Last 30 lines of output:"
            tail -30 /tmp/dpkg-source.log
            exit 1
          }
          echo "Extraction complete"

          # When an explicit output directory is given, dpkg-source -x extracts
          # the source directly INTO that directory (not into a subdirectory).
          SRC_DIR="kernel-src"
          echo "SRC_DIR=${SRC_DIR}" >> "$GITHUB_ENV"
          echo "Extracted to: ${SRC_DIR}"

          # Verify the extraction produced a real kernel source tree
          FILE_COUNT=$(find "${SRC_DIR}" -type f | wc -l)
          echo "Extracted ${FILE_COUNT} files"
          [ "${FILE_COUNT}" -gt 5000 ] || {
            echo "ERROR: Extraction produced only ${FILE_COUNT} files (expected >5000)"
            echo "Top-level contents:"
            ls -la "${SRC_DIR}/"
            exit 1
          }

          echo "Top-level contents:"
          ls "${SRC_DIR}/"

      # -----------------------------------------------------------------------
      # 6. Configure git
      # -----------------------------------------------------------------------
      - name: Configure git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name  "github-actions[bot]"

      # -----------------------------------------------------------------------
      # 7. Prepare the suite branch
      # -----------------------------------------------------------------------
      - name: Clone repository for suite branch update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git clone "${REPO_URL}" suite-repo

      - name: Check out or create suite branch
        run: |
          cd suite-repo

          if git ls-remote --exit-code origin "refs/heads/${SUITE}" >/dev/null 2>&1; then
            echo "Branch '${SUITE}' exists – checking out"
            git checkout "${SUITE}"
            git rm -rf --quiet . 2>/dev/null || true
          else
            echo "Branch '${SUITE}' does not exist – creating orphan branch"
            git checkout --orphan "${SUITE}"
            git rm -rf --quiet . 2>/dev/null || true
          fi

      - name: Populate suite branch with extracted source
        run: |
          echo "Copying source tree from ${SRC_DIR} → suite-repo/"
          rsync -a --delete \
            --exclude='.git' \
            "${SRC_DIR}/" suite-repo/

          # Verify rsync copied the files
          COPIED=$(find suite-repo/ -type f | wc -l)
          echo "Files in suite-repo after rsync: ${COPIED}"
          [ "${COPIED}" -gt 5000 ] || {
            echo "ERROR: rsync copied only ${COPIED} files"
            exit 1
          }

          # Ensure debian/ symlink exists in the suite branch.
          # The Ubuntu kernel source package does not include debian/ as a
          # symlink in the .diff.gz — it is expected to be created at build
          # time. We add it here so the noble branch is self-contained and
          # the build can run without extra setup.
          if [ ! -e suite-repo/debian ] && [ -d suite-repo/debian.master ]; then
            ln -sf debian.master suite-repo/debian
            echo "Created debian -> debian.master symlink in suite-repo"
          fi

          cd suite-repo

          SYNC_DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          printf '%s\n\n%s\n%s\n%s\n%s\n%s\n' \
            "${SUITE}: ${VERSION}" \
            "Ubuntu suite   : ${SUITE}" \
            "Kernel version : ${VERSION}" \
            "Upstream       : ${UPSTREAM_VERSION}" \
            "Source         : https://launchpad.net/ubuntu/${SUITE}/+source/${SOURCE}/${VERSION}" \
            "Synced         : ${SYNC_DATE}" \
            > /tmp/commit-msg.txt

          git add --all

          if git diff --cached --quiet; then
            echo "No changes to commit – suite branch already has this content"
          else
            git commit -F /tmp/commit-msg.txt
            echo "Committed ${SUITE} branch at $(git rev-parse HEAD)"
          fi

      - name: Tag the commit
        run: |
          cd suite-repo
          # Use -f to overwrite existing tag when force=true
          git tag -fa "${TAG}" -m "Ubuntu ${SUITE} kernel ${VERSION}"
          echo "Tagged: ${TAG}"

      - name: Push suite branch and tag
        run: |
          cd suite-repo
          git push origin "${SUITE}"
          # Use --force to overwrite existing tag when force=true
          git push --force origin "${TAG}"
          echo "Pushed branch '${SUITE}' and tag '${TAG}'"

      # -----------------------------------------------------------------------
      # 7. Summary
      # -----------------------------------------------------------------------
      - name: Print summary
        if: always()
        run: |
          echo "## Source Sync Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Suite    | \`${SUITE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version  | \`${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch   | [\`${SUITE}\`](https://github.com/${{ github.repository }}/tree/${SUITE}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag      | [\`${TAG}\`](https://github.com/${{ github.repository }}/releases/tag/${TAG}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Launchpad | https://launchpad.net/ubuntu/${SUITE}/+source/${SOURCE}/${VERSION} |" >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # Job 3: trigger-build
  # --------------------------------------------------------------------------
  trigger-build:
    name: "Trigger kernel build"
    runs-on: ubuntu-24.04-arm
    needs: [check-version, sync]
    if: needs.sync.result == 'success'

    steps:
      - name: Dispatch build-kernel workflow
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE:    ${{ needs.check-version.outputs.suite }}
          VERSION:  ${{ needs.check-version.outputs.version }}
        run: |
          gh workflow run build-kernel.yml \
            --repo "${{ github.repository }}" \
            --field suite="${SUITE}" \
            --field kernel_version="${VERSION}" \
            --field arch="arm64" \
            --field flavor="generic" \
            --field build_mode="docker"

          echo "Build workflow dispatched for ${SUITE} ${VERSION}"
